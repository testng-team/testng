org.gradle.parallel=true
kotlin.code.style=official

# Single source of truth for the Java versions used across the build.
# Consumed by the main build (build-parameters), and read from disk by the
# build-logic / build-logic-commons included builds.
# jdkBuildVersion: JDK used to build TestNG. targetJavaVersion: bytecode target.
jdkBuildVersion=25
targetJavaVersion=17
# See https://kotlinlang.org/docs/gradle.html#dependency-on-the-standard-library
# Note: testng.kotlin-library.gradle.kts adds kotlin-stdlib for testImplementation
kotlin.stdlib.default.dependency=false

testng.version=7.13.0

group=org.testng

project.name=TestNG
project.url=https\://testng.org
project.vendor.name=TestNG
project.vendor.id=org.testng

# For now this URL is used only in POM references, and release tags are pused
scm.url=https\://github.com/testng-team/testng.git

# In most cases it is the same as the project group
nexus.profile=org.testng
github.organization=testng-team
github.repository=testng

# Fix Gradle warning with sonarqube plugin v4.x
# See https://community.sonarsource.com/t/sonarscanner-for-gradle-you-can-now-decide-when-to-compile/102069
systemProp.sonar.gradle.skipCompile=true

# Disable configuration cache: com.github.autostyle:4.0 registers a Gradle.buildFinished
# listener, which the configuration cache does not support. See
# https://docs.gradle.org/current/userguide/configuration_cache_requirements.html#config_cache:requirements:build_listeners
# Autostyle (latest 4.0.1) is effectively unmaintained, so there is no upstream fix ticket;
# the general Gradle tracking issue is https://github.com/gradle/gradle/issues/13490
# (com.github.vlsi.gradle-extensions was bumped to 3.0.2, which is configuration-cache compatible.)
org.gradle.configuration-cache=false
