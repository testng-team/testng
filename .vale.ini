StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = TestNG

# Vale.Spelling only. Vale.Terms treats every accept.txt entry's casing as canonical, so it
# demands "testng" for "TestNG" and "sha" for "SHA". Vale.Repetition fires on code fragments.
#
# Markdown and Java only. The changelog is Markdown but is exempted below.
[*.md]
BasedOnStyles = TestNG, Vale
Vale.Terms = NO
Vale.Repetition = NO

[*.java]
BasedOnStyles = TestNG, Vale
Vale.Terms = NO
Vale.Repetition = NO

# An empty BasedOnStyles switches every style off, for this file and no other.
# docs/WRITING_STYLE.md says why, and why the pattern needs its **/ prefix.
[**/CHANGELOG.md]
BasedOnStyles =
