StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = TestNG

# Vale.Spelling only. Vale.Terms treats every accept.txt entry's casing as canonical, so it
# demands "testng" for "TestNG" and "sha" for "SHA". Vale.Repetition fires on code fragments.
#
# Markdown only, not *.txt: CHANGES.txt is two decades of contributor names and issue
# references, and produced 1129 of 1197 findings on its own.
[*.md]
BasedOnStyles = TestNG, Vale
Vale.Terms = NO
Vale.Repetition = NO

[*.java]
BasedOnStyles = TestNG, Vale
Vale.Terms = NO
Vale.Repetition = NO
