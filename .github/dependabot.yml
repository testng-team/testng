version: 2

# Declaring `labels` replaces Dependabot's defaults (dependencies, java, github_actions), and a
# label that does not exist in the repository is silently ignored, so these names must stay in step
# with the repository. The taxonomy is documented in .github/LABELS.md.
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependency: update"
      - "dependency: github actions"

  # The workflow matrix generator (.github/workflows/matrix.mjs) is a real npm project with its
  # own package.json and lock file. The github-actions ecosystem above does not look at it.
  - package-ecosystem: "npm"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    labels:
      - "dependency: update"
      - "dependency: npm"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      # Check for updates at 00:00 UTC
      time: "00:00"
    labels:
      - "dependency: update"
      - "dependency: java"
    groups:
      # The recipe BOM and the Gradle plugin are released together upstream: rewrite-recipe-bom
      # 3.38.0 is the release that carries rewrite-gradle-plugin 7.41.0. Taken one at a time they
      # leave the pair mismatched, and each pull request pays for its own rewriteDryRun run. The
      # glob covers both names, since the plugin is reported without a group id.
      openrewrite:
        patterns:
          - "org.openrewrite*"
    ignore:
      # Autostyle 4.0.1 bundles a google-java-format that reaches into javac internals without
      # the --add-exports JPMS flags, so every module fails on JDK 25 with:
      #   RemoveUnusedImports (unnamed module) cannot access com.sun.tools.javac.file.JavacFileManager
      # Drop this entry once a release fixes it. See testng-team/testng#3292.
      - dependency-name: "com.github.autostyle:autostyle-plugin-gradle"
        versions: ["4.0.1"]
