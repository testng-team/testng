# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Test

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [ master ]

concurrency:
  # On master/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' ) && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  matrix_prep:
    name: Matrix Preparation
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      # Ask matrix.mjs to produce 8 jobs. The java_version axis has 7 values (11, 17, 21, 25, 26
      # and the EA 27/28), so this leaves one row of slack for the other axes to pair against.
      MATRIX_JOBS: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: set-matrix
        run: |
          npm ci --prefix .github/workflows
          node .github/workflows/matrix.mjs

  rewrite:
    name: 'OpenRewrite'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: temurin
          architecture: x64
      # The gate is the Gradle task itself, so this is reproducible locally with
      # ./gradlew rewriteDryRun -PfailOnRewriteDryRun=true
      - name: Check the OpenRewrite recipes leave nothing to do
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3
        with:
          job-id: rewrite
          # Test sources are excluded from rewriting, so compiling them feeds nothing into the
          # LST -- skipping them is most of this job's runtime. Error Prone is a javac plugin
          # that OpenRewrite never sees, and the build matrix already runs it.
          arguments: |
            --no-daemon
            rewriteDryRun
            -x compileTestJava
            -x compileTestKotlin
          properties: |
            jdkBuildVersion=25
            failOnRewriteDryRun=true
            skipErrorProne=true
            # rewriteDryRun builds a type-attributed LST of every main source file, which needs
            # noticeably more heap than Gradle's default.
            org.gradle.jvmargs=-Xmx3g
            org.gradle.java.installations.auto-download=false
      - name: Summarise the patch
        if: ${{ failure() }}
        run: |
          patch=build/reports/rewrite/rewrite.patch
          [ -s "$patch" ] || exit 0
          echo "::error::OpenRewrite would still change these files. Run './gradlew rewriteRun', then './gradlew autostyleApply', review the diff and commit it."
          git apply --stat "$patch"
          echo "The full patch is attached as the 'rewrite-patch' artifact."
      - name: Upload the patch
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rewrite-patch
          path: build/reports/rewrite/rewrite.patch
          if-no-files-found: ignore

  build:
    needs: matrix_prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix_prep.outputs.matrix)}}
    name: '${{ matrix.name }}'
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Set up Java ${{ matrix.java_version }}, oracle
        if: ${{ matrix.oracle_java_website != '' }}
        uses: oracle-actions/setup-java@fff43251af9936a0e6a4d5d0946e14f1680e9b6b # v1.5.0
        with:
          website: ${{ matrix.oracle_java_website }}
          release: ${{ matrix.java_version }}
      - name: Set up Java ${{ matrix.non_ea_java_version }} (test) and 25 (Gradle + build), ${{ matrix.java_distribution }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          # Install multiple Java versions:
          # - Test version (11, 17, 21, 25, or 26): used to run TestNG tests
          # - Java 25: runs Gradle and builds TestNG (jdkBuildVersion=25); Gradle 9 runs on JDK 25.
          #   Kept last so it becomes JAVA_HOME. TestNG artifacts still target Java 11.
          java-version: |
            ${{ matrix.non_ea_java_version }}
            25
          distribution: ${{ matrix.java_distribution }}
          architecture: x64
      - name: Steps to reproduce
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            console.log('The following command might help reproducing CI results, use Java ${{ matrix.java_version }}')
            console.log('TZ="${{ matrix.tz }}" ./gradlew build ${{ matrix.extraGradleArgs }} -Ptestng.test.extra.jvmargs="${{ matrix.testExtraJvmArgs }}" -PtestDisableCaching="${{ matrix.testDisableCaching }}"')
      - name: 'Generate unique build id'
        id: build_id
        run: echo "unique_id=$(date +%s)" >> $GITHUB_OUTPUT
      - name: Test
        id: run_test_cases
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3
        with:
          job-id: jdk${{ matrix.java_version }}
          arguments: |
            --no-parallel --no-daemon --scan
            build
            ${{ matrix.extraGradleArgs }}
          properties: |
            testng.test.extra.jvmargs=${{ matrix.testExtraJvmArgs }}
            testDisableCaching=${{ matrix.testDisableCaching }}
            jdkBuildVersion=25
            jdkTestVersion=${{ matrix.java_version }}
            jdkTestVendor=${{ matrix.java_vendor }}
            # We provision JDKs with GitHub Actions for caching purposes, so Gradle should rather fail in case JDK is not found
            org.gradle.java.installations.auto-download=false
      - name: Upload build reports
        if: ${{ failure() && steps.run_test_cases.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports-${{ matrix.java_distribution }}-${{ matrix.java_version }}-${{ steps.build_id.outputs.unique_id }}
          path: testng-core/build/reports/tests/test/**
