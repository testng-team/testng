name: Refresh execution inventory

# testng-core/execution-inventory.txt records which tests ran, so verifyTestExecution can tell when
# one silently stops running. It only protects tests it lists, and it does not fail a build for a
# test it has never seen -- otherwise every pull request would go red the moment master gained a
# test. That leaves new tests unguarded until someone regenerates the file, and a contributor has no
# reason to know the file exists.
#
# This cannot loop: the pull request it opens touches only execution-inventory.txt, which is not
# under the watched paths, so merging it does not trigger another run.
#
# Only *additions* can drift, because verifyTestExecution already runs in check on every pull
# request: a test that stops running, or whose status changes, turns that pull request red and
# cannot land quietly. A test that is merely new passes, and is then left unguarded.
#
# New tests come from test sources, so this runs when those change and not otherwise. There is no
# way to tell whether the inventory moved without running the suite, so the path filter is what
# keeps that cost off every unrelated merge.

on:
  push:
    branches: [master]
    paths:
      - 'testng-core/src/test/**'
      - 'testng-core/src/test/resources/testng.xml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 25
          distribution: temurin

      - name: Regenerate the inventory
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3
        with:
          job-id: refresh-execution-inventory
          arguments: |
            --no-parallel --no-daemon
            :testng-core:verifyTestExecution
          properties: |
            updateExecutionInventory=true
            jdkBuildVersion=25

      - name: Open a pull request if it changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: testng-core/execution-inventory.txt
          branch: chore/refresh-execution-inventory
          delete-branch: true
          commit-message: |
            chore(tests): refresh the execution inventory

            Regenerated after test sources changed on master. The diff is the set
            of tests that joined or left the run; verifyTestExecution guards only
            what this file lists.
          title: 'chore(tests): refresh the execution inventory'
          body: |
            Opened by the `Refresh execution inventory` workflow after a change to test sources
            on master.

            `verifyTestExecution` guards only the tests listed in
            `testng-core/execution-inventory.txt`, and it deliberately does not fail on a test it
            has never seen — otherwise every pull request would go red the moment master gained a
            test. This refresh is what brings newly added tests under the guard.

            **Read the diff before merging.** Additions are ordinary. Two things are not:

            - a **removal** means a test stopped running on master, which is exactly what the guard
              exists to catch. Do not merge that away without understanding it;
            - a **status change** to `SKIP` or `FAIL` may be a flaky run being written into the
              baseline. Merging it makes every later build compare against the flake.
