name: Publish Snapshot

# Automatically publish snapshot versions to Maven Central Snapshots repository
# whenever code is pushed to the master branch
on:
  push:
    branches: [ master ]

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Gradle wrapper validation
      uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

    # JDK 25 is the build toolchain (jdkBuildVersion=25); Gradle itself runs on JDK 21
    # because Gradle 8.11 cannot run on JDK 25 yet. TestNG artifacts target Java 17
    # (targetJavaVersion=17). The last version in the list becomes JAVA_HOME (Gradle launcher).
    - name: Set up JDK 25 (build toolchain) and JDK 21 (Gradle launcher)
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: 'temurin'
        java-version: |
          25
          21

    - name: Publish Snapshot to Central
      env:
        CENTRAL_PORTAL_USERNAME: ${{ secrets.NEXUS_USERNAME }}
        CENTRAL_PORTAL_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      run: |
        ./gradlew publishAllPublicationsToCentralSnapshotsRepository \
          -Prelease=false \
          --no-daemon \
          --stacktrace

    - name: Display completion message
      run: |
        echo "✅ Snapshot published to Maven Central Snapshots repository"
        echo "Snapshots are available at: https://central.sonatype.com/artifact/org.testng/testng"
