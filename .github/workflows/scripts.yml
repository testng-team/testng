name: scripts

on:
  pull_request:
    # The document and the test sources are listed because refs-in-sync.sh compares them. The
    # workflow file is listed too, so a pull request that changes a check still runs it.
    paths:
      - 'scripts/**'
      - 'CHANGELOG.md'
      - 'docs/test-issue-references.md'
      - 'testng-core/src/test/java/**'
      - '.github/workflows/scripts.yml'

# The tests only read the checkout and write to a temporary directory.
permissions:
  contents: read

jobs:
  issue-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tests build their own git repositories in a temporary directory. They never push,
          # so the token does not need to stay in .git/config.
          persist-credentials: false
          # changelog-convert-test.sh runs changelog-convert.py, which reads CHANGES.txt out
          # of history and checks every comparison link against a real tag. A default
          # checkout carries neither. The script refuses to run without them rather than
          # reporting a clean file it never checked, so the job would fail on a shallow one.
          fetch-depth: 0
      # Discovery, not a list. Naming each suite here let a new script ship with no test at all,
      # which is how both of these did. run-all.sh fails when scripts/x.sh has no
      # scripts/test/x-test.sh, and runs every suite it finds.
      - name: Test the scripts
        run: scripts/test/run-all.sh
      # A row in docs/test-issue-references.md is a claim that the code carries that description.
      # Phase 3 wrote five rows and never touched the code, and only the reviewer noticed.
      - name: Check the issue references against the code
        run: scripts/refs-in-sync.sh
